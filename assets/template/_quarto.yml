project:
  type: website
  output-dir: report

execute:
  freeze: auto
  cache: false

website:
  title: "BTC scRNA Report"

  repo-url: https://github.com/break-through-cancer/btc-scrna-pipeline
  repo-branch: master
  repo-actions: [issue]

  sidebar:
    logo: SCRATCH.png
    pinned: true
    align: center

    contents:
      - auto: "notebook*.qmd"

  page-footer:
    right: "This page is built with ❤️ and [Quarto](https://quarto.org/)."
    left: "BTC Data Science Team"

format:
  html:
    toc: true
    toc-location: right
    toc-depth: 2
    embed-resources: true
    code-fold: show
    code-tools: true
    warnings: false
    df-print: paged
    fig-format: png
    fig-dpi: 300
    fig-responsive: true
    fig-align: center
    theme: litera

    # Quarto's default `article` layout caps the content column at 991px, of
    # which the body gets ~700px. Figures authored at fig-width 10-18 inches were
    # being squeezed into that, which is why every plot looked small regardless of
    # how it was drawn. `full` lets the body use the window, and the explicit grid
    # gives the body the space rather than the margins.
    page-layout: full
    grid:
      sidebar-width: 260px
      body-width: 1500px
      margin-width: 200px
      gutter-width: 1.4rem
  ipynb: default

format-links: [ipynb]